services:
  - type: web
    name: jarvis
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn jarvis:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: JARVIS_SECRET_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
